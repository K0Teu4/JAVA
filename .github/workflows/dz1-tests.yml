name: DZ1 Maven tests

on:
  push:
    branches: [main]
    paths:
      - "dz1/**"
      - ".github/workflows/dz1-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run all DZ1 tests
        run: mvn --batch-mode --no-transfer-progress -f dz1/pom.xml clean test
